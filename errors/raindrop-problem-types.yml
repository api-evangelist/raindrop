generated: '2026-07-20'
method: searched
source: >-
  Live probe of api.raindrop.ai/v1 (401 envelope) plus documented status codes
  in raindrop.ai/docs/sdk/http-api and query-api/api-reference.
format: custom-json
envelope: '{ "error": { "code": "<CODE>", "message": "<human message>" } }'
note: >-
  Raindrop does not use RFC 9457 application/problem+json. Errors return a JSON
  object with error.code and error.message. Ingest returns 204 on success.
problems:
- status: 400
  code: BAD_REQUEST
  title: Bad Request
  remediation: Validate the request body shape and field types; events must be a JSON array.
- status: 401
  code: UNAUTHORIZED
  title: Unauthorized
  detail: Invalid or missing API key.
  remediation: "Send a valid 'Authorization: Bearer <key>' header for the correct API."
- status: 403
  code: FORBIDDEN
  title: Forbidden
  remediation: Ensure the key has access to the targeted project (X-Raindrop-Project-Id).
- status: 404
  code: NOT_FOUND
  title: Not Found
  remediation: Verify the resource id and endpoint path.
- status: 413
  code: PAYLOAD_TOO_LARGE
  title: Payload Too Large
  remediation: Keep each event under the 1 MB size limit.
- status: 429
  code: RATE_LIMITED
  title: Too Many Requests
  remediation: Respect Query API limits (200 RPM, search 50 RPM, 20 RPS) and back off.
- status: 500
  code: INTERNAL_SERVER_ERROR
  title: Internal Server Error
  remediation: Retry with backoff; contact founders@raindrop.ai if it persists.
