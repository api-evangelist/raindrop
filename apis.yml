apis:
- name: Raindrop Ingest API
  description: >-
    Server-to-server ingest/tracking API for sending AI interactions, events,
    feedback signals, and user identity into Raindrop. Bearer write-key auth;
    authorized requests return 204. Project targeting via X-Raindrop-Project-Id.
  humanURL: https://www.raindrop.ai/docs/sdk/http-api
  baseURL: https://api.raindrop.ai/v1
  properties:
  - type: Documentation
    url: https://www.raindrop.ai/docs/sdk/http-api
  - type: Authentication
    url: authentication/raindrop-authentication.yml
  - type: ErrorCatalog
    url: errors/raindrop-problem-types.yml
- name: Raindrop Query API
  description: >-
    Read-only Query API for retrieving events, traces, signals, users, and
    conversations from Raindrop, including search, count, timeseries, and
    facets. Bearer query-key auth; rate limited (200 RPM, search 50 RPM,
    20 RPS). Project scoping via X-Raindrop-Project-Id.
  humanURL: https://www.raindrop.ai/docs/query-api/api-reference
  baseURL: https://query.raindrop.ai/v1
  properties:
  - type: APIReference
    url: https://www.raindrop.ai/docs/query-api/api-reference
  - type: SDK
    url: https://www.raindrop.ai/docs/query-api/sdk
  - type: RateLimits
    url: conventions/raindrop-conventions.yml
